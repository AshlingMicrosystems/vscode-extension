name: Feature request
description: Suggest a new feature or an improvement to the RiscFree extension.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. **This issue will be public**, so don't include anything confidential.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: input
    id: context
    attributes:
      label: Targets, probes or SDKs involved
      placeholder: "Arm Cortex-M, Vitra-XS, arm-sdk 26.4.0"
